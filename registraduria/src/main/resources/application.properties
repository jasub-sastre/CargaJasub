# Puerto del servicio
server.port=8080

# Base de datos en memoria usada durante las pruebas de carga
registry.jdbc-url=jdbc:h2:mem:regdb;DB_CLOSE_DELAY=-1

# --- Observabilidad (Actuator + Micrometer) ---
# Se exponen solo los endpoints que el taller necesita.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
server.tomcat.mbeanregistry.enabled=true

# Percentiles de latencia por endpoint HTTP: permite comparar lo que mide k6
# desde el cliente con lo que mide el servidor. La diferencia entre ambos es
# tiempo de red y de encolamiento.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
