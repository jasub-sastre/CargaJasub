# Flujo de Integración Continua para las pruebas de carga.
#
# ESTE ARCHIVO NO SE EJECUTA DESDE perf/ci/.
# GitHub Actions solo lee los workflows de .github/workflows/. Cópielo así:
#
#     mkdir -p .github/workflows
#     cp perf/ci/github-actions.yml .github/workflows/perf.yml
#
# Se deja aquí como plantilla para que quede versionada junto al resto del
# material de rendimiento. (Fase 3 la extendió a dos jobs — ver Decisions
# Log en handoff-phase-3.md para el porqué.)

name: perf-tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Duración de soak (formato k6, ej. 25m, 2h)"
        required: false
        default: "25m"
  schedule:
    # Nightly, 03:00 UTC. Corre los escenarios largos sin bloquear ningún PR.
    - cron: "0 3 * * *"

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — Gate rápido. Corre en cada PR. Escenarios cortos (~5 min c/u):
  # baseline (latencia/error) y baseline de voters (resultado de negocio).
  # Los thresholds definidos en los scripts k6 SON el gate: si se
  # incumplen, k6 termina con código != 0 y el step (y el job) fallan.
  # ---------------------------------------------------------------------
  k6-quick-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # El workflow levanta el servicio EN EL PROPIO RUNNER.
      # Sin este paso no habría nada que cargar: es el error más común al
      # llevar pruebas de rendimiento a CI.
      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio en segundo plano
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"; exit 0
            fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app.log; exit 1
        working-directory: registraduria

      - name: Instalar k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Preparar carpeta de resultados
        run: mkdir -p perf/results

      # 'baseline' es una escena fija (20 VUs constantes, 5 min) definida
      # DENTRO del script (ALL_SCENARIOS.baseline). No se pasan --vus ni
      # --duration por CLI: cuando options.scenarios está presente, k6
      # ignora esos flags silenciosamente y los tomaría por un descuido
      # (ver Decisions Log, Fase 3) — así que se omiten aquí a propósito.
      - name: Baseline de rendimiento (latencia y error rate)
        run: |
          k6 run perf/scripts/register_person_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline


      - name: Reiniciar servicio antes de voters
        run: |
          pkill -f registraduria-1.0-SNAPSHOT.jar || true
          sleep 3
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app-voters.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app-voters.log; exit 1
        working-directory: registraduria
        
      # Segundo gate: verifica el RESULTADO DE NEGOCIO, no solo la latencia.
      # Un servicio que responde rápido pero mal sigue estando roto.
      - name: Verificación de resultado de negocio (voters)
        run: |
          k6 run perf/scripts/register_voter_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline

      # Los thresholds del script son el gate: si p95 supera el SLO o la tasa
      # de error pasa del 1%, k6 termina con código distinto de 0 y el paso
      # falla. No hace falta lógica adicional.

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-quick-gate
          # Solo los resúmenes. NO se sube el volcado de -o json=, que para
          # una corrida de segundos puede pesar cientos de megabytes.
          path: perf/results/summary-*.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Job 2 — Escenarios largos. NO corre en PR (bloquearía la revisión:
  # stress+spike+soak suman ~40+ min). Corre por disparo manual
  # (workflow_dispatch) o nocturno (schedule). Mismo patrón de gate.
  # ---------------------------------------------------------------------
  k6-extended:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio en segundo plano
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"; exit 0
            fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app.log; exit 1
        working-directory: registraduria

      - name: Instalar k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Preparar carpeta de resultados
        run: mkdir -p perf/results

      - name: Stress
        run: |
          k6 run perf/scripts/register_person_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=stress

      # Reinicio obligatorio entre escenarios largos: H2 es en memoria y
      # persiste mientras el proceso vive. Sin esto, spike/soak arrancarían
      # con IDs ya usados por stress y darían falsos DUPLICATED (ver
      # handoff-phase-1.md, Decisions Log).
      - name: Reiniciar servicio antes de spike
        run: |
          pkill -f registraduria-1.0-SNAPSHOT.jar || true
          sleep 3
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app-spike.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app-spike.log; exit 1
        working-directory: registraduria

      - name: Spike
        run: |
          k6 run perf/scripts/register_person_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=spike

      - name: Reiniciar servicio antes de soak
        run: |
          pkill -f registraduria-1.0-SNAPSHOT.jar || true
          sleep 3
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app-soak.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app-soak.log; exit 1
        working-directory: registraduria

      - name: Soak
        run: |
          k6 run perf/scripts/register_person_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=soak \
            --env SOAK_DURATION=${{ github.event.inputs.soak_duration || '25m' }}

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-extended
          path: perf/results/summary-*.json
          if-no-files-found: warn
